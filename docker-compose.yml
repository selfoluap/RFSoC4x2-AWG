services:
  backend:
    image: rfsoc-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    container_name: rfsoc-backend
    working_dir: /app
    environment:
      RFSOC_OFFLINE: "1"
    command: uvicorn backend.backend:app --host 0.0.0.0 --port 8001
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/status', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: rfsoc-frontend:local
    build:
      context: ./frontend
    container_name: rfsoc-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
